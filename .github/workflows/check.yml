name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # jsdom (used by the webview tests) requires Node 22.22 or newer.
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, tests, and the security invariants (no process execution, strict webview CSP).
      - run: npm run check
